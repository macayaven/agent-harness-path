<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>{{ title }}</title>
  <style>
    /* Tokens — light is the default; dark follows the OS (prefers-color-scheme).
       Contrast (WCAG 2.2): text/bg 16.1 | 14.8, muted/bg 6.7 | 7.7,
       accent/bg 5.9 | 8.9, line-strong/bg 3.7 | 3.8 (non-text UI). */
    :root {
      --bg: #faf8f4; --surface: #ffffff; --surface-2: #f2eee7;
      --text: #1f1b16; --muted: #5f574d;
      --line: #e2dcd2; --line-strong: #8a8073;
      --accent: #9a4a1c; --accent-soft: #f6e7dc; --on-accent: #ffffff;
      --predict: #1f5f8b; --predict-soft: #e5eef5;
      --check: #2d6a3e; --check-soft: #e4efe6;
      --warn: #7a5a00; --warn-soft: #f5edd6;
      --plate: #1f2020; --plate-line: #3a3b3b;
      --serif: "Iowan Old Style", Charter, "Bitstream Charter", Georgia, serif;
      --sans: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      --fs-label: .75rem; --fs-sm: .9375rem; --fs-base: 1.0625rem;
      --fs-lead: 1.125rem; --fs-h3: 1.1875rem; --fs-h2: 1.625rem;
      --fs-h1: clamp(1.75rem, 1.2rem + 2.4vw, 2.5rem);
      --radius-sm: 4px; --radius: 10px;
      --measure: 44rem;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161411; --surface: #1f1c18; --surface-2: #2a2621;
        --text: #ece6dc; --muted: #b0a697;
        --line: #3a342d; --line-strong: #7a7064;
        --accent: #f0a36b; --accent-soft: #33251b; --on-accent: #161411;
        --predict: #8cc4ec; --predict-soft: #1b2630;
        --check: #8fd19e; --check-soft: #1b2a1f;
        --warn: #e9c46a; --warn-soft: #2e2715;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
      font-size: var(--fs-base); line-height: 1.65; }
    p, li { text-wrap: pretty; }
    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: .18em; }
    a:hover { text-decoration-thickness: 2px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: var(--radius-sm); }
    .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .skip { position: absolute; left: -9999px; top: .5rem; z-index: 10; background: var(--accent); color: var(--on-accent); padding: .5rem .9rem; border-radius: var(--radius-sm); }
    .skip:focus { left: .75rem; }
    .label { margin: 0 0 .35rem; font-size: var(--fs-label); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

    /* Site header + course rail */
    .site { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
    .site-inner { max-width: 76rem; margin: 0 auto; padding: .7rem 1.25rem; display: flex; align-items: center; gap: .6rem 1.25rem; flex-wrap: wrap; }
    .brand { font-family: var(--serif); font-weight: 700; color: var(--text); text-decoration: none; white-space: nowrap; }
    .rail { flex: 1 1 18rem; display: flex; align-items: center; gap: .75rem; min-width: 0; }
    .rail ol { list-style: none; margin: 0; padding: 0; display: flex; gap: 3px; flex: 1; min-width: 0; }
    .rail li { flex: 1; min-width: 0; }
    .rail a { display: block; padding: 6px 0; margin: -6px 0; }
    .rail a::before { content: ""; display: block; height: 6px; border-radius: 3px; border: 1px solid var(--line-strong); }
    .rail-done a::before { background: var(--line-strong); }
    .rail-current a::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent); }
    .rail-optional a::before { border-style: dashed; }
    .rail-count { font-family: var(--mono); font-size: .8125rem; color: var(--muted); white-space: nowrap; }

    /* Page grid: reading column + outline */
    .page { max-width: 76rem; margin: 0 auto; padding: 0 1.25rem; display: flex; gap: 3.5rem; align-items: flex-start; }
    main { flex: 1 1 0; min-width: 0; max-width: var(--measure); padding-bottom: 4rem; }
    .page-plain main { margin: 0 auto; max-width: 52rem; }
    .outline { flex: 0 0 14rem; position: sticky; top: 4.5rem; padding-top: 4rem; max-height: calc(100vh - 5rem); overflow-y: auto; }
    .outline ol, .outline-inline ol { list-style: none; margin: 0; padding: 0; font-size: .875rem; line-height: 1.4; }
    .outline ol { border-left: 1px solid var(--line); }
    .outline a { display: block; padding: .35rem .75rem; color: var(--muted); text-decoration: none; margin-left: -1px; border-left: 2px solid transparent; }
    .outline a:hover { color: var(--text); border-left-color: var(--line-strong); }
    .outline-inline { display: none; margin: 1.25rem 0 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .outline-inline summary { cursor: pointer; padding: .75rem 1rem; font-weight: 600; min-height: 44px; }
    .outline-inline ol { padding: 0 1rem 1rem; }
    .outline-inline a { display: block; padding: .45rem 0; color: var(--text); text-decoration: none; }
    @media (max-width: 68.75rem) { .outline { display: none; } .outline-inline { display: block; } }

    /* Top/bottom nav (markup pinned by tests: nav.lesson-nav > span.nav-*) */
    .lesson-nav { display: flex; justify-content: space-between; gap: .5rem 1rem; padding: .9rem 0; font-size: var(--fs-sm); flex-wrap: wrap; }
    .lesson-nav a { color: var(--muted); text-decoration: none; }
    .lesson-nav a:hover { color: var(--text); }
    @media (min-width: 40rem) {
      main > .lesson-nav:first-of-type { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; }
      main > .lesson-nav:first-of-type .nav-next { text-align: right; }
    }
    main > .lesson-nav:last-of-type { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: .75rem; margin-top: 2.5rem; }
    main > .lesson-nav:last-of-type a { display: block; min-height: 44px; padding: .85rem 1rem; border: 1px solid var(--line); border-radius: var(--radius); color: var(--text); }
    main > .lesson-nav:last-of-type .nav-next a { border-color: var(--accent); text-align: right; }
    main > .lesson-nav:last-of-type span:empty { display: none; }

    /* Headings */
    .kicker { margin: 1.5rem 0 .6rem; font-family: var(--mono); font-size: .8125rem; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
    h1, h2, h3 { line-height: 1.25; }
    h1 { margin: 0 0 1.75rem; font-family: var(--serif); font-size: var(--fs-h1); line-height: 1.15; letter-spacing: -.01em; text-wrap: balance; }
    .h1-slug { display: block; font-family: var(--mono); font-size: .95rem; font-weight: 500; letter-spacing: 0; color: var(--muted); margin-bottom: .4rem; }
    h2 { font-family: var(--serif); font-size: var(--fs-h2); margin: 3rem 0 .75rem; }
    h3 { font-size: var(--fs-h3); margin: 1.75rem 0 .5rem; }
    hr { display: none; }

    /* Spine card */
    .spine { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
    .spine-cells { display: grid; grid-template-columns: repeat(auto-fit, minmax(12.5rem, 1fr)); }
    .spine-cell { padding: 1rem 1.1rem; border-bottom: 1px solid var(--line); }
    .spine-cell p { margin: 0; }
    .spine-code { margin-bottom: .35rem !important; }
    .spine-text { font-size: var(--fs-sm); line-height: 1.55; color: var(--muted); }
    .spine-ship { background: var(--accent-soft); }
    .spine-ship .label { color: var(--accent); }
    .spine-ship .spine-text { color: var(--text); }
    .spine-ship code { background: var(--surface); }
    .spine-next .spine-code a { font-weight: 600; }
    .strip { padding: .85rem 1.1rem; }
    .strip .label code { background: none; padding: 0; font-size: 1em; text-transform: none; letter-spacing: 0; }
    .strip ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; font-family: var(--mono); font-size: .8125rem; }
    .strip li { padding: .15rem .5rem; border-radius: 999px; }
    .chip-done { background: var(--surface-2); }
    .chip-current { background: var(--accent); color: var(--on-accent); font-weight: 700; }
    .chip-ahead { border: 1px dashed var(--line-strong); color: var(--muted); padding: .1rem .45rem; }
    .lead { margin: 1.5rem 0 0; font-size: var(--fs-lead); line-height: 1.6; }
    .meta-grid { margin: 1.25rem 0 0; padding: 1rem 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .75rem 1.5rem; font-size: var(--fs-sm); line-height: 1.5; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .meta-grid dt { font-size: var(--fs-label); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .meta-grid dd { margin: .2rem 0 0; }

    /* Index spine */
    .index-spine ol { list-style: none; margin: 2rem 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: .75rem; }
    .index-spine a { display: flex; flex-direction: column; gap: .3rem; height: 100%; min-height: 44px; padding: 1rem 1.1rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); text-decoration: none; }
    .index-spine a:hover { border-color: var(--line-strong); }
    .card-optional a { border: 1px dashed var(--line-strong); background: transparent; }
    .card-n { font-family: var(--mono); font-size: .8125rem; font-weight: 700; color: var(--accent); }
    .card-optional .card-n, .card-tag { color: var(--muted); }
    .card-tag { font-size: var(--fs-label); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
    .card-title { font-weight: 650; line-height: 1.3; }
    .index-spine code { align-self: flex-start; font-size: .75rem; }

    /* Arc sections (data-arc set by build.py) */
    .arc[data-arc="promise"], .arc[data-arc="checkpoint"] { margin-top: 2.5rem; padding: 1.25rem 1.35rem; border-radius: var(--radius); border: 1px solid var(--line); }
    .arc[data-arc="promise"] { background: var(--accent-soft); }
    .arc[data-arc="promise"] h2, .arc[data-arc="unlocks"] h2 { margin: 0 0 .5rem; font-family: var(--sans); font-size: .8125rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
    .arc[data-arc="promise"] p { font-size: var(--fs-lead); }
    .arc[data-arc="checkpoint"] { background: var(--check-soft); }
    .arc[data-arc="checkpoint"] h2 { margin-top: 0; font-size: 1.5rem; }
    .arc[data-arc="checkpoint"] h2::before { content: "Checkpoint"; display: block; margin-bottom: .35rem; font-family: var(--sans); font-size: var(--fs-label); letter-spacing: .08em; text-transform: uppercase; color: var(--check); }
    .arc[data-arc="promise"] > :last-child, .arc[data-arc="checkpoint"] > :last-child, .arc[data-arc="unlocks"] > :last-child { margin-bottom: 0; }
    li[data-arc="predict"] { margin: .5rem 0 .75rem; padding: 1rem 1.1rem; border-radius: var(--radius); background: var(--predict-soft); border: 1px solid var(--line); }
    li[data-arc="predict"]::marker { color: var(--predict); font-weight: 700; }
    li[data-arc="predict"]::before { content: "Predict first"; display: block; margin-bottom: .35rem; font-size: var(--fs-label); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--predict); }
    .arc[data-arc="misconceptions"] ul { list-style: none; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .arc[data-arc="misconceptions"] li { padding: .9rem 1.1rem; border-bottom: 1px solid var(--line); background: var(--surface); }
    .arc[data-arc="misconceptions"] li:last-child { border-bottom: 0; }
    .arc[data-arc="misconceptions"] li > em:first-child { display: block; color: var(--warn); font-weight: 600; margin-bottom: .3rem; }
    .arc[data-arc="unlocks"] { margin-top: 3rem; padding: 1.25rem 1.35rem; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); }

    /* Code, tables, details, figures, quotes */
    code, pre { font-family: var(--mono); font-size: .88em; }
    code { background: var(--surface-2); padding: .08em .35em; border-radius: var(--radius-sm); overflow-wrap: anywhere; }
    pre { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .9rem 1rem; overflow-x: auto; line-height: 1.5; }
    pre code { background: none; padding: 0; overflow-wrap: normal; }
    .table-scroll { max-width: 100%; overflow-x: auto; margin: 1rem 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    table { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); line-height: 1.5; }
    .table-scroll table { min-width: 34rem; }
    th, td { border-bottom: 1px solid var(--line); padding: .6rem .75rem; text-align: left; vertical-align: top; }
    tbody tr:last-child td { border-bottom: 0; }
    th { font-size: .8125rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--surface-2); }
    td strong { font-weight: 600; }
    blockquote { margin: 1rem 0; padding: .9rem 1.1rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--warn-soft); }
    details { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 1.1rem; margin: .5rem 0; }
    summary { cursor: pointer; font-weight: 600; padding: .85rem 0; min-height: 44px; line-height: 1.45; }
    details[open] summary { border-bottom: 1px solid var(--line); margin-bottom: .85rem; }
    details[open] { padding-bottom: 1rem; }
    .static-diagram-scroll { overflow-x: auto; margin: 1.75rem 0; background: var(--plate); border: 1px solid var(--plate-line); border-radius: var(--radius); padding: 1rem; }
    .static-diagram { width: max(100%, var(--diagram-width)); max-width: none; height: auto; display: block; }
    footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .8125rem; }
    @media print { .site, .outline, .outline-inline, .lesson-nav { display: none; } .page { display: block; } }
  </style>
</head>
<body>
<a class="skip" href="#lesson">Skip to lesson</a>
<header class="site">
  <div class="site-inner">
    <a class="brand" href="{{ home }}">The Agent Harness Path</a>
    {{ rail }}
  </div>
</header>
<div class="page {{ page_class }}">
<main id="lesson">
{{ nav }}
{{ body }}
{{ nav }}
<footer>
  Generated by <code>tools/build.py</code> from
  <code>{{ source }}</code> — part of The Agent Harness Path.
</footer>
</main>
{{ outline }}
</div>
</body>
</html>
