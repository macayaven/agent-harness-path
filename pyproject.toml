[project]
name = "agent-harness-path"
version = "0.6.0rc1"
description = "The Agent Harness Path: a self-contained course on building, evaluating, and governing LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0 AND CC-BY-4.0" }
authors = [{ name = "Carlos Crespo Macaya" }]
# Dependencies are tooling only: `marimo` is the notebook runtime, `markdown`
# renders the sessions/ HTML. Course logic stays Python standard library only
# (AGENTS.md rule 2); the two permitted non-stdlib imports
# are `marimo` and the course's own `cafe` package. No provider SDK: the model
# client in `cafe/model.py` is `urllib` against /chat/completions.
dependencies = ["marimo==0.24.2", "markdown>=3.5"]

[project.urls]
Homepage = "https://github.com/macayaven/agent-harness-path"
Documentation = "https://github.com/macayaven/agent-harness-path"
Issues = "https://github.com/macayaven/agent-harness-path/issues"
Changelog = "https://github.com/macayaven/agent-harness-path/blob/main/CHANGELOG.md"

[tool.uv]
package = false

[dependency-groups]
diagrams = [
    "playwright==1.58.0",
]

[tool.marimo.save]
autosave = "after_delay"
autosave_delay = 1000
format_on_save = false
