name: Notebook fail
description: A marimo notebook does not run top-to-bottom, or was not committed in canonical form
title: "[notebook] "
labels: ["notebook"]
body:
  - type: input
    id: file
    attributes:
      label: Notebook
      placeholder: sessions/s08-observability-replay/toy.py
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Command and error
      description: Prefer the headless run, `COURSE_MODE=stub PYTHONPATH="$PWD/tests/no_network_site:$PWD" uv run python sessions/DIR/toy.py`, or `uv run marimo edit sessions/DIR/toy.py`.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Does not execute
        - Not committed in canonical marimo form
        - Non-stdlib import
        - Claim contradicts the lesson
    validations:
      required: true
