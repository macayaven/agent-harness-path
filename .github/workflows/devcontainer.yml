# Devcontainer smoke: does a student container actually build and run?
#
# Path-filtered on purpose. The learner verify workflow stays zero-network;
# this job pulls public images, so it only runs when the container surface,
# its validator, or the tutored-rules mirror changes. No keys, nothing pushed.
name: devcontainer
on:
  pull_request:
    paths: &smoke_paths
      - ".devcontainer/**"
      - ".vscode/**"
      - ".github/instructions/**"
      - ".cursor/rules/**"
      - ".github/workflows/devcontainer.yml"
      - "tools/check_devcontainer.py"
      - "tests/test_codespaces.py"
  push:
    branches: [main]
    paths: *smoke_paths
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v5
      - name: Validate devcontainer surface
        run: uv run python tools/check_devcontainer.py
      # No PATH export: uv is system-wide, so this proves a plain shell
      # (student terminal included) finds it.
      - name: Build container and run offline suite inside
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: COURSE_MODE=stub uv run python -m unittest discover -s tests
