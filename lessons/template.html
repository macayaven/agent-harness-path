<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }}</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a222c;
      --surface-2: #243040;
      --text: #e7ecf1;
      --muted: #9aa8b5;
      --line: #2f3d4c;
      --ok: #3dba7e;
      --bad: #e07070;
      --warn: #d4a017;
      --accent: #5eb1ff;
      --mono: "IBM Plex Mono", "SF Mono", ui-monospace, Menlo, monospace;
      --sans: "IBM Plex Sans", "Source Sans 3", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.6;
    }
    main {
      max-width: 52rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    h1, h2, h3 { line-height: 1.25; }
    h1 { font-size: 1.7rem; border-bottom: 1px solid var(--line); padding-bottom: .5rem; }
    h2 { font-size: 1.3rem; margin-top: 2.2rem; color: var(--accent); }
    h3 { font-size: 1.05rem; margin-top: 1.6rem; }
    a { color: var(--accent); }
    code, pre { font-family: var(--mono); font-size: .9em; }
    code { background: var(--surface-2); padding: .1em .35em; border-radius: 4px; }
    pre {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: .9rem 1rem;
      overflow-x: auto;
    }
    pre code { background: none; padding: 0; }
    pre.mermaid { background: var(--surface); text-align: center; }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1rem 0;
      font-size: .92rem;
    }
    th, td {
      border: 1px solid var(--line);
      padding: .45rem .6rem;
      text-align: left;
      vertical-align: top;
    }
    th { background: var(--surface-2); }
    td { background: var(--surface); }
    blockquote {
      margin: 1rem 0;
      padding: .4rem 1rem;
      border-left: 3px solid var(--warn);
      background: var(--surface);
      color: var(--muted);
    }
    details {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: .5rem .9rem;
      margin: .6rem 0;
    }
    summary { cursor: pointer; font-weight: 600; color: var(--accent); }
    hr { border: none; border-top: 1px solid var(--line); margin: 2rem 0; }
    .meta { color: var(--muted); font-size: .85rem; }
    .lesson-nav {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin: 1.5rem 0;
      color: var(--muted);
      font-size: .9rem;
    }
    .lesson-nav a { color: var(--muted); }
    footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .82rem;
    }
  </style>
</head>
<body>
<main>
{{ nav }}
{{ body }}
{{ nav }}
<footer>
  Generated by <code>lessons/build.py</code> from
  <code>lessons/src/{{ source }}</code> — part of The Agent Harness Path.
</footer>
</main>
<script src="./vendor/mermaid.min.js"></script>
<script>
  mermaid.initialize({ startOnLoad: true, theme: "dark" });
</script>
</body>
</html>
